# Define the common data root and number of views
data_root: /home/travail/ryan/renders 
num_views: 4
num_views_val: 10

data_module:
  _target_: fast3r.data.multiview_dust3r_datamodule.MultiViewDUSt3RDataModule
  train_datasets:
    - 80_000 @ Co3d_Multiview(split='train', num_views=${data.num_views}, window_degree_range=360, num_samples_per_window=100, ROOT='${data.data_root}', aug_crop=16, mask_bg='rand', resolution=[(917,701)], transform=ColorJitter)
  validation_datasets:
    - 100 @ Co3d_Multiview(split='test', num_views=${data.num_views_val}, window_degree_range=360, num_samples_per_window=100, ROOT='${data.data_root}, resolution=[(917,701)], seed=777)
  batch_size_per_device: 6
  batch_size_per_device_val: 4
  num_workers: 6
  pin_memory: True


