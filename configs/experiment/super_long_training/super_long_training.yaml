# @package _global_

defaults:
  - override /model: fast3r

# seed for random number generators in pytorch, numpy and python.random
seed: 42


tags: ["train", "super_long_training"]

task_name: super_long_training
slurm_job_id: 99999 # must set in the command line

# ckpt_path: /path/to/resume.ckpt  # uncomment to resume training from a checkpoint

paths:
  run_folder_name: ${task_name}_${slurm_job_id}

logger:
  wandb:
    name: ${task_name}_${slurm_job_id}

data:
  num_views: 20
  num_views_val: 10
  data_scaling: 1.0
  data_module:
    pin_memory: true
    num_workers: 6
    num_workers_val: 1 # have to be a low number when using DeepSpeed ZeRO-2
    batch_size_per_device: 1
    batch_size_per_device_val: 1
    train_datasets:
      - 80_000 @ Co3d_Multiview(split='train', data_scaling=${data.data_scaling}, num_views=${data.num_views}, window_degree_range=360, num_samples_per_window=100, ROOT='${data.data_root}', aug_crop=16, mask_bg='rand', resolution=(512, 384), transform=ColorJitter)
    validation_datasets:
      - 100 @ Co3d_Multiview(split='test', num_views=${data.num_views_val}, window_degree_range=360, num_samples_per_window=100, ROOT='${data.data_root}', resolution=(512, 384), seed=777)

model:
  net:
    head_args:
      with_local_head: True
    decoder_args:
      random_image_idx_embedding: true
      enc_embed_dim: ${model.net.encoder_args.embed_dim}
      embed_dim: 1024
      num_heads: 16
      depth: 24
      mlp_ratio: 4.0
      qkv_bias: true
      drop: 0.0
      attn_drop: 0.0
      attn_implementation: flash_attention

  train_criterion:
    _target_: fast3r.dust3r.losses.ConfLossMultiviewV2
    pixel_loss:
      _target_: fast3r.dust3r.losses.Regr3DMultiviewV4
      criterion:
        _target_: fast3r.dust3r.losses.L21Loss
      norm_mode: avg_dis
    alpha: 0.2

  validation_criterion:
    _target_: fast3r.dust3r.losses.ConfLossMultiviewV2
    pixel_loss:
      _target_: fast3r.dust3r.losses.Regr3DMultiviewV4
      criterion:
        _target_: fast3r.dust3r.losses.L21Loss
      norm_mode: avg_dis
    alpha: 0.2

trainer:
  devices: auto
  max_epochs: 500
  strategy: auto

